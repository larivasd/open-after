<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Mini Brote en Verde salvia">
  <defs>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="rgb(164, 176, 158)"/>
      <stop offset="0.55" stop-color="#8A9A82"/>
      <stop offset="1" stop-color="rgb(99, 111, 94)"/>
    </linearGradient>
    <linearGradient id="solapa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgb(150, 164, 143)"/>
      <stop offset="1" stop-color="rgb(119, 132, 112)"/>
    </linearGradient>
    <linearGradient id="asa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgb(80, 89, 75)"/>
      <stop offset="0.5" stop-color="rgb(121, 136, 114)"/>
      <stop offset="1" stop-color="rgb(80, 89, 75)"/>
    </linearGradient>
    <radialGradient id="sombra">
      <stop offset="0" stop-color="rgba(60,45,32,.30)"/>
      <stop offset="1" stop-color="rgba(60,45,32,0)"/>
    </radialGradient>
    <clipPath id="marco"><rect width="800" height="1000"/></clipPath>
  </defs>

  <rect width="800" height="1000" fill="#F3EFE8"/>

  <g clip-path="url(#marco)">
    <g transform="translate(400 466) rotate(3) scale(1.7399999999999998) translate(-400 -500)">
      <ellipse cx="400" cy="796" rx="196" ry="30" fill="url(#sombra)"/>
      
    <path d="M304 476 h192 a26 26 0 0 1 26 26 v168 a26 26 0 0 1-26 26 H304
             a26 26 0 0 1-26-26 V502 a26 26 0 0 1 26-26 Z" fill="url(#cuerpo)"/>
    <path d="M278 540 h244" stroke="rgba(0,0,0,.14)" stroke-width="3"/>
    <path d="M316 476 c0-84 38-124 84-124 s84 40 84 124"
          fill="none" stroke="url(#asa)" stroke-width="11" stroke-linecap="round"/>
    <path d="M300 580 q100 22 200 0" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="8"/>
    <path d="M300 632 q100 22 200 0" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="8"/>
    </g>
  </g>

  <text x="40" y="944" font-family="Georgia, serif" font-size="30" fill="rgba(43,39,34,.62)">Mini Brote</text>
  <text x="40" y="976" font-family="system-ui, sans-serif" font-size="19" letter-spacing="2.4" fill="rgba(43,39,34,.38)">VERDE SALVIA · DETALLE</text>
  <text x="760" y="976" text-anchor="end" font-family="system-ui, sans-serif" font-size="17" letter-spacing="3" fill="rgba(43,39,34,.24)">FOTO DE EJEMPLO</text>
</svg>

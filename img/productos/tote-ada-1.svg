<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Tote Ada en Arena">
  <defs>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="rgb(211, 195, 176)"/>
      <stop offset="0.55" stop-color="#C7B29A"/>
      <stop offset="1" stop-color="rgb(143, 128, 111)"/>
    </linearGradient>
    <linearGradient id="solapa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgb(205, 186, 164)"/>
      <stop offset="1" stop-color="rgb(171, 153, 132)"/>
    </linearGradient>
    <linearGradient id="asa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgb(115, 103, 89)"/>
      <stop offset="0.5" stop-color="rgb(175, 157, 136)"/>
      <stop offset="1" stop-color="rgb(115, 103, 89)"/>
    </linearGradient>
    <radialGradient id="sombra">
      <stop offset="0" stop-color="rgba(60,45,32,.30)"/>
      <stop offset="1" stop-color="rgba(60,45,32,0)"/>
    </radialGradient>
    <clipPath id="marco"><rect width="800" height="1000"/></clipPath>
  </defs>

  <rect width="800" height="1000" fill="#F3EFE8"/>

  <g clip-path="url(#marco)">
    <g transform="translate(400 466) rotate(0) scale(1.16) translate(-400 -500)">
      <ellipse cx="400" cy="796" rx="196" ry="30" fill="url(#sombra)"/>
      
    <path d="M232 380 h336 l34 372 a24 24 0 0 1-24 26 H222 a24 24 0 0 1-24-26 Z"
          fill="url(#cuerpo)"/>
    <path d="M292 380 c0-92 46-138 108-138 s108 46 108 138"
          fill="none" stroke="url(#asa)" stroke-width="17" stroke-linecap="round"/>
    <path d="M232 380 h336" stroke="rgba(0,0,0,.13)" stroke-width="3"/>
    </g>
  </g>

  <text x="40" y="944" font-family="Georgia, serif" font-size="30" fill="rgba(43,39,34,.62)">Tote Ada</text>
  <text x="40" y="976" font-family="system-ui, sans-serif" font-size="19" letter-spacing="2.4" fill="rgba(43,39,34,.38)">ARENA · FRENTE</text>
  <text x="760" y="976" text-anchor="end" font-family="system-ui, sans-serif" font-size="17" letter-spacing="3" fill="rgba(43,39,34,.24)">FOTO DE EJEMPLO</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Clutch Luna en Negro">
  <defs>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="rgb(89, 87, 84)"/>
      <stop offset="0.55" stop-color="#2A2724"/>
      <stop offset="1" stop-color="rgb(30, 28, 26)"/>
    </linearGradient>
    <linearGradient id="solapa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgb(63, 61, 58)"/>
      <stop offset="1" stop-color="rgb(36, 34, 31)"/>
    </linearGradient>
    <linearGradient id="asa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgb(24, 23, 21)"/>
      <stop offset="0.5" stop-color="rgb(37, 34, 32)"/>
      <stop offset="1" stop-color="rgb(24, 23, 21)"/>
    </linearGradient>
    <radialGradient id="sombra">
      <stop offset="0" stop-color="rgba(60,45,32,.30)"/>
      <stop offset="1" stop-color="rgba(60,45,32,0)"/>
    </radialGradient>
    <clipPath id="marco"><rect width="800" height="1000"/></clipPath>
  </defs>

  <rect width="800" height="1000" fill="#F3EFE8"/>

  <g clip-path="url(#marco)">
    <g transform="translate(400 466) rotate(0) scale(1.16) translate(-400 -500)">
      <ellipse cx="400" cy="796" rx="196" ry="30" fill="url(#sombra)"/>
      
    <path d="M186 470 h428 a22 22 0 0 1 22 22 v184 a22 22 0 0 1-22 22 H186
             a22 22 0 0 1-22-22 V492 a22 22 0 0 1 22-22 Z" fill="url(#cuerpo)"/>
    <path d="M164 560 h472" stroke="rgba(0,0,0,.15)" stroke-width="4"/>
    <path d="M164 492 a22 22 0 0 1 22-22 h428 a22 22 0 0 1 22 22 v68 H164 Z"
          fill="url(#solapa)"/>
    <rect x="378" y="546" width="44" height="12" rx="6" fill="rgba(255,255,255,.4)"/>
    </g>
  </g>

  <text x="40" y="944" font-family="Georgia, serif" font-size="30" fill="rgba(43,39,34,.62)">Clutch Luna</text>
  <text x="40" y="976" font-family="system-ui, sans-serif" font-size="19" letter-spacing="2.4" fill="rgba(43,39,34,.38)">NEGRO · FRENTE</text>
  <text x="760" y="976" text-anchor="end" font-family="system-ui, sans-serif" font-size="17" letter-spacing="3" fill="rgba(43,39,34,.24)">FOTO DE EJEMPLO</text>
</svg>
